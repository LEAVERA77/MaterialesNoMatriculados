name: Actualizar Materiales

on:
  repository_dispatch:
    types: [actualizar_stock]

jobs:
  update-excel:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install openpyxl

      - name: Actualizar Excel
        env:
          DATOS: ${{ toJson(github.event.client_payload) }}
        run: |
          python -c "
          import os, json
          from openpyxl import load_workbook
          
          datos = json.loads(os.environ['DATOS'])
          print('--- DATOS RECIBIDOS ---')
          print(json.dumps(datos, indent=2, ensure_ascii=False))
          print('-----------------------')
          
          archivo = 'listado_materiales_ENERSA.xlsx'
          wb = load_workbook(archivo)
          ws = wb.active
          
          for item in datos['items']:
              encontrado = False
              print(f'Buscando en Excel: [{item['material']}]')
              for row in ws.iter_rows(min_row=3):
                  # Usamos .strip() en ambos lados para evitar problemas por espacios
                  nombre_excel = str(row[0].value).strip().lower() if row[0].value else ''
                  nombre_buscado = item['material'].strip().lower()
                  
                  if nombre_excel == nombre_buscado:
                      print(f'  -> ENCONTRADO en fila {row[0].row}: {row[0].value}')
                      cant = float(row[3].value) if row[3].value else 0.0
                      if datos['operacion'] == 'retiro':
                          row[3].value = max(0, cant - float(item['cantidad']))
                      else:
                          row[3].value = cant + float(item['cantidad'])
                      encontrado = True
                      break
              if not encontrado:
                  print(f'  -> NO SE ENCONTRO: {item['material']}')
          
          if 'Historial' not in wb.sheetnames:
              ws_hist = wb.create_sheet('Historial')
              ws_hist.append(['Fecha', 'Usuario', 'Operacion', 'Material', 'Cantidad', 'Uso'])
          else:
              ws_hist = wb['Historial']
              
          for item in datos['items']:
              ws_hist.append([datos['fecha'], datos['usuario'], datos['operacion'].upper(), item['material'], item['cantidad'], datos['uso']])
              
          wb.save(archivo)
          print('Archivo Excel guardado exitosamente.')
          "
      
      - name: Commit y Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add *.xlsx
          git commit -m "Actualización de stock: ${{ github.event.client_payload.operacion }} - ${{ github.event.client_payload.usuario }}" || echo "No hay cambios"
          git push
