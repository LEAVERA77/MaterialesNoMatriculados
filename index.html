<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ENERSA · Gestión de Materiales</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        :root {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary-color: #0f172a;
            --primary-hover: #1e293b;
            --accent-color: #3b82f6;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.05), 0 4px 6px -2px rgba(0,0,0,0.025);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background-color: var(--bg-color); 
            padding: 2rem 1.5rem; 
            color: var(--text-main); 
            line-height: 1.5;
        }

        .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            background: var(--surface-color); 
            border-radius: var(--radius-lg); 
            box-shadow: var(--shadow-lg); 
            padding: 2.5rem; 
            border: 1px solid var(--border-color);
        }

        h1 { 
            font-size: 1.5rem; 
            font-weight: 600; 
            display: flex; 
            align-items: center; 
            gap: 0.75rem; 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 1.5rem; 
            margin-bottom: 2rem; 
            color: var(--primary-color);
            letter-spacing: -0.02em;
        }
        h1 i { color: var(--accent-color); font-size: 1.25rem; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
        .field-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .field-group label { font-weight: 500; font-size: 0.85rem; color: var(--text-muted); }
        
        input, select, textarea { 
            width: 100%; 
            padding: 0.75rem 1rem; 
            border: 1px solid var(--border-color); 
            border-radius: var(--radius-md); 
            font-size: 0.95rem; 
            font-family: inherit;
            color: var(--text-main);
            background-color: var(--surface-color);
            transition: all 0.2s ease;
        }
        
        input:focus, select:focus, textarea:focus { 
            outline: none; 
            border-color: var(--accent-color); 
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); 
        }

        input[readonly] { background-color: #f1f5f9; color: var(--text-muted); cursor: not-allowed; }

        .items-section { 
            background: var(--bg-color); 
            border-radius: var(--radius-md); 
            padding: 1.5rem; 
            margin: 2rem 0; 
            border: 1px solid var(--border-color); 
        }
        .items-section h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .item-row { 
            display: flex; 
            gap: 1rem; 
            align-items: flex-start; 
            margin-bottom: 1rem; 
            background: var(--surface-color); 
            padding: 1rem; 
            border-radius: var(--radius-md); 
            border: 1px solid var(--border-color); 
            position: relative;
            box-shadow: var(--shadow-sm);
        }
        
        .material-col { flex: 3; position: relative; }
        .qty-col { flex: 1; min-width: 80px; }
        .unit-col { flex: 1; min-width: 90px; }
        .action-col { display: flex; align-items: center; justify-content: center; flex: 0 0 40px; }
        
        .btn-icon { 
            background: #fee2e2; 
            border: none; 
            border-radius: var(--radius-sm); 
            width: 36px; 
            height: 36px; 
            color: var(--danger-color); 
            cursor: pointer; 
            transition: all 0.2s;
        }
        .btn-icon:hover { background: #fecaca; }
        .btn-icon:disabled { opacity: 0.5; cursor: not-allowed; }

        .suggestions-box { 
            position: absolute; 
            top: calc(100% + 4px); 
            left: 0; 
            right: 0; 
            background: var(--surface-color); 
            border: 1px solid var(--border-color); 
            border-radius: var(--radius-md); 
            max-height: 200px; 
            overflow-y: auto; 
            z-index: 1000; 
            display: none; 
            box-shadow: var(--shadow-lg); 
        }
        .suggestions-box div { padding: 0.75rem 1rem; cursor: pointer; font-size: 0.9rem; border-bottom: 1px solid var(--border-color); }
        .suggestions-box div:last-child { border-bottom: none; }
        .suggestions-box div:hover { background: var(--bg-color); color: var(--accent-color); }

        .button-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; margin-top: 2rem; }
        .btn-group { display: flex; gap: 0.75rem; flex-wrap: wrap; }
        
        .btn { 
            border: none; 
            padding: 0.75rem 1.25rem; 
            border-radius: var(--radius-md); 
            font-weight: 500; 
            font-size: 0.9rem;
            cursor: pointer; 
            display: inline-flex; 
            align-items: center; 
            gap: 0.5rem; 
            transition: all 0.2s ease; 
        }
        
        .btn-primary { background: var(--primary-color); color: white; }
        .btn-primary:hover { background: var(--primary-hover); box-shadow: var(--shadow-md); }
        
        .btn-warning { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
        .btn-warning:hover { background: #fef3c7; }
        
        .btn-secondary { background: var(--surface-color); color: var(--text-main); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background: var(--bg-color); }
        
        .btn-info { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }
        .btn-info:hover { background: #dbeafe; }
        
        .btn-success { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }
        .btn-success:hover { background: #d1fae5; }

        .btn-danger { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }
        .btn-danger:hover { background: #fee2e2; }
        
        .btn:disabled { opacity: 0.6; cursor: not-allowed; box-shadow: none; }

        .toast { 
            position: fixed; 
            bottom: 2rem; 
            right: 2rem; 
            background: var(--primary-color); 
            color: white; 
            padding: 1rem 1.5rem; 
            border-radius: var(--radius-md); 
            font-weight: 500; 
            opacity: 0; 
            transform: translateY(10px);
            transition: all 0.3s ease; 
            z-index: 9999; 
            box-shadow: var(--shadow-lg);
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast.error { background: var(--danger-color); }
        
        .required:after { content: " *"; color: var(--danger-color); }
        
        .loader { display: none; text-align: center; padding: 1rem; font-weight: 500; color: var(--accent-color); }

        /* Modales */
        .modal-overlay { 
            position: fixed; 
            top: 0; left: 0; right: 0; bottom: 0; 
            background: rgba(15, 23, 42, 0.4); 
            backdrop-filter: blur(4px);
            display: none; 
            justify-content: center; 
            align-items: center; 
            z-index: 10000; 
            padding: 1rem; 
        }
        .modal-content { 
            background: var(--surface-color); 
            border-radius: var(--radius-lg); 
            width: 100%; 
            max-width: 900px; 
            max-height: 90vh; 
            display: flex; 
            flex-direction: column; 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); 
        }
        .modal-header { padding: 1.5rem; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .modal-header h2 { font-size: 1.25rem; color: var(--primary-color); margin: 0; font-weight: 600; }
        .modal-header button { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-muted); transition: color 0.2s; }
        .modal-header button:hover { color: var(--danger-color); }
        
        .modal-search { padding: 1rem 1.5rem; background: var(--bg-color); border-bottom: 1px solid var(--border-color); display: flex; gap: 1rem; }
        
        .modal-body { padding: 1.5rem; overflow-y: auto; flex: 1; }
        
        .table-stock { width: 100%; border-collapse: collapse; text-align: left; min-width: 600px; }
        .table-stock th, .table-stock td { padding: 1rem; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
        .table-stock th { background: var(--bg-color); color: var(--text-muted); font-weight: 500; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; position: sticky; top: 0; }
        .table-stock tr:hover { background: var(--bg-color); }
        
        .stock-cero { color: var(--danger-color); font-weight: 600; }
        .stock-bajo { color: var(--warning-color); font-weight: 600; }
        
        .row-retiro { font-weight: 500; color: var(--primary-color); }
        .row-devolucion { color: var(--text-muted); }

        .modal-footer { padding: 1.25rem 1.5rem; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 1rem; background: var(--bg-color); border-radius: 0 0 var(--radius-lg) var(--radius-lg); }
        
        .table-responsive { overflow-x: auto; width: 100%; }

        /* Comprobante */
        .receipt { background: #fff; border: 1px solid var(--border-color); padding: 2rem; border-radius: var(--radius-md); max-width: 450px; margin: 0 auto; font-family: 'Inter', monospace; color: var(--text-main); box-shadow: var(--shadow-sm); }
        .receipt h3 { text-align: center; border-bottom: 1px dashed var(--border-color); padding-bottom: 1rem; margin-bottom: 1rem; font-weight: 600; }
        .receipt p { margin-bottom: 0.5rem; font-size: 0.9rem; display: flex; justify-content: space-between; }
        .receipt-table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.85rem; }
        .receipt-table th, .receipt-table td { border-bottom: 1px solid var(--border-color); padding: 0.5rem; text-align: left; }
        .receipt-footer { text-align: center; margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-muted); border-top: 1px dashed var(--border-color); padding-top: 1rem; }

        @media (max-width: 768px) {
            body { padding: 0.5rem; }
            .container { padding: 1.25rem; border-radius: var(--radius-md); }
            h1 { font-size: 1.25rem; padding-bottom: 1rem; margin-bottom: 1.5rem; }
            .form-grid { grid-template-columns: 1fr; gap: 1rem; }
            .item-row { flex-wrap: wrap; padding: 0.75rem; }
            .material-col { flex: 1 1 100%; }
            .qty-col { flex: 1 1 45%; }
            .unit-col { flex: 1 1 45%; }
            .action-col { flex: 1 1 100%; justify-content: flex-end; margin-top: 0.5rem; }
            .button-bar { flex-direction: column; align-items: stretch; }
            .btn-group { flex-direction: column; }
            .btn { width: 100%; justify-content: center; padding: 0.85rem; }
            .modal-content { max-height: 95vh; height: 95vh; border-radius: var(--radius-md); }
            .modal-header h2 { font-size: 1.1rem; }
            .modal-search { flex-direction: column; padding: 1rem; }
            .modal-body { padding: 0.5rem; }
            .modal-footer { flex-direction: column; padding: 1rem; }
            .table-stock th, .table-stock td { padding: 0.75rem 0.5rem; }
        }

        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; padding: 0; margin: 0; background: white; }
            .table-stock { width: 100%; border: 1px solid #000; min-width: 100%; }
            .table-stock th, .table-stock td { border: 1px solid #000; padding: 0.5rem; font-size: 0.8rem; color: #000; }
            .table-stock th { background: #eee !important; -webkit-print-color-adjust: exact; }
            .modal-overlay { position: static; background: transparent; display: block; padding: 0; }
            .modal-content { box-shadow: none; max-height: none; max-width: none; border-radius: 0; height: auto; border: none; }
            .modal-header, .modal-search, .modal-footer { display: none !important; }
            .modal-body { overflow: visible; padding: 0; }
            .receipt { border: none; margin: 0; max-width: 100%; box-shadow: none; padding: 0; }
            @page { size: A4; margin: 1.5cm; }
        }
    </style>
</head>
<body>
<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--border-color); padding-bottom: 1.5rem; margin-bottom: 2rem;">
        <h1 style="border: none; margin: 0; padding: 0;"><i class="fas fa-box"></i> Gestión de Materiales</h1>
        <span style="color: var(--text-muted); font-size: 0.85rem; font-weight: 500;">ENERSA · María Grande</span>
    </div>

    <div class="form-grid">
        <div class="field-group">
            <label for="fecha">Fecha <span class="required"></span></label>
            <input type="date" id="fecha" required>
        </div>
        <div class="field-group">
            <label for="usuario">Usuario <span class="required"></span></label>
            <select id="usuario" required>
                <option value="">— Seleccionar —</option>
            </select>
        </div>
    </div>

    <div class="field-group" style="margin-bottom: 1.5rem;">
        <label for="uso">Uso / destino <span class="required"></span></label>
        <textarea id="uso" placeholder="Describa el uso o destino del material..." rows="2" required></textarea>
    </div>

    <div class="items-section">
        <h2><i class="fas fa-list-ul"></i> Materiales a mover</h2>
        <div id="itemsContainer"></div>
        <button type="button" id="addItemBtn" class="btn btn-secondary" style="margin-top: 1rem;"><i class="fas fa-plus"></i> Añadir otro material</button>
    </div>

    <div class="button-bar">
        <div id="modeBadge" style="font-weight: 500; font-size: 0.85rem; color: var(--text-muted);">Esperando acción</div>
        <div class="btn-group">
            <button type="button" id="verStockBtn" class="btn btn-info"><i class="fas fa-search"></i> Ver Stock</button>
            <button type="button" id="verHistorialBtn" class="btn btn-secondary"><i class="fas fa-history"></i> Historial</button>
            <button type="button" id="retiroBtn" class="btn btn-primary"><i class="fas fa-arrow-down"></i> Retirar</button>
            <button type="button" id="devolucionBtn" class="btn btn-warning"><i class="fas fa-arrow-up"></i> Devolver</button>
            <button type="button" id="resetBtn" class="btn btn-secondary"><i class="fas fa-times"></i> Limpiar</button>
        </div>
    </div>
    <div id="loader" class="loader"><i class="fas fa-circle-notch fa-spin"></i> Procesando...</div>
</div>

<!-- Modal Stock -->
<div class="modal-overlay" id="stockModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Stock en Tiempo Real</h2>
            <button type="button" id="closeStockBtn"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-search">
            <input type="text" id="stockSearchInput" placeholder="Buscar material...">
        </div>
        <div class="modal-body table-responsive" id="printAreaStock">
            <table class="table-stock" id="stockTable">
                <thead>
                    <tr>
                        <th>Material</th>
                        <th>Especificación</th>
                        <th>Unidad</th>
                        <th>Stock</th>
                    </tr>
                </thead>
                <tbody id="stockTableBody"></tbody>
            </table>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-success" onclick="exportarTablaExcel('stockTable', 'Reporte_de_Stock')"><i class="fas fa-file-excel"></i> Exportar</button>
            <button type="button" class="btn btn-secondary" onclick="imprimirTabla('stockTable')"><i class="fas fa-print"></i> Imprimir</button>
        </div>
    </div>
</div>

<!-- Modal Historial -->
<div class="modal-overlay" id="historyModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>Historial de Movimientos</h2>
            <button type="button" id="closeHistoryBtn"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-search">
            <select id="filterUserSelect">
                <option value="">Todos los usuarios</option>
            </select>
        </div>
        <div class="modal-body table-responsive" id="printAreaHistory">
            <table class="table-stock" id="historyTable">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Usuario</th>
                        <th>Operación</th>
                        <th>Material</th>
                        <th>Cant.</th>
                        <th>Uso</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="historyTableBody"></tbody>
            </table>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-success" onclick="exportarTablaExcel('historyTable', 'Historial_de_Movimientos')"><i class="fas fa-file-excel"></i> Exportar</button>
            <button type="button" class="btn btn-secondary" onclick="imprimirTabla('historyTable')"><i class="fas fa-print"></i> Imprimir</button>
        </div>
    </div>
</div>

<!-- Modal Comprobante -->
<div class="modal-overlay" id="receiptModal">
    <div class="modal-content" style="max-width: 500px;">
        <div class="modal-header">
            <h2>Comprobante</h2>
            <button type="button" onclick="document.getElementById('receiptModal').style.display='none'"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body" style="background: var(--bg-color);" id="printAreaReceipt">
            <div class="receipt" id="receiptContent"></div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-primary" onclick="imprimirComprobante()"><i class="fas fa-print"></i> Imprimir Ticket</button>
        </div>
    </div>
</div>

<div id="toast" class="toast">Mensaje</div>

        const MATERIALES = MATERIALES_RAW.map(line => {
            const parts = line.split('|').map(s => s.trim());
            return { 
                nombre: parts[0] || '—', 
                especificacion: parts[1] || '', 
                unidad: parts[2] || 'u.', 
                display: `${parts[0]} ${parts[1] ? '· ' + parts[1] : ''} (${parts[2]})`,
                searchString: `${parts[0]} ${parts[1]}`.toLowerCase()
            };
        });

        const USUARIOS = ["MATEO, LUCAS", "ESTEBENET, JONATHAN", "GRIMALDI, GABRIEL", "LEHNER, DANILO", "MONZÓN, HUGO", "GIMENEZ, ROSENDO", "CIARROCA, ENZO", "CIARROCA, MANUEL", "ISAAC, LEANDRO", "ELZESAR, JUAN", "MILANICH, ALEJANDRO", "CIARROCA, MANUEL", "GRILLE, EMILIANO", "NARVAEZ, RAUL", "MAIER, FERNANDO", "ALBARENQUE, FERNANDO", "LARA, VALENTIN", "ECKERT, ENZO", "WEISHEIM, FABIAN", "TABORDA, SERGIO", "GOMEZ, ALEJANDRO", "OLGIATTI, DUILIO", "VERA, LEANDRO"];

        function showToast(msg, isError = false) {
            toastEl.textContent = msg;
            toastEl.className = `toast show ${isError ? 'error' : ''}`;
            clearTimeout(window.toastTimeout);
            window.toastTimeout = setTimeout(() => toastEl.classList.remove('show'), 4000);
        }

        function buscarMateriales(query) {
            if (!query || query.trim().length < 2) return [];
            const q = query.toLowerCase().trim();
            let resultados = MATERIALES.filter(m => m.searchString.includes(q));
            
            if (resultados.length === 0) {
                const scored = MATERIALES.map(m => {
                    const dist = levenshtein(q, m.searchString);
                    return { material: m, score: dist };
                });
                scored.sort((a, b) => a.score - b.score);
                resultados = scored.filter(s => s.score <= Math.max(3, Math.floor(q.length * 0.5))).map(s => s.material);
            }
            return resultados.slice(0, 10);
        }

        function levenshtein(a, b) {
            const matrix = [];
            for (let i = 0; i <= a.length; i++) matrix[i] = [i];
            for (let j = 0; j <= b.length; j++) matrix[0][j] = j;
            for (let i = 1; i <= a.length; i++) {
                for (let j = 1; j <= b.length; j++) {
                    matrix[i][j] = Math.min(matrix[i-1][j] + 1, matrix[i][j-1] + 1, matrix[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
                }
            }
            return matrix[a.length][b.length];
        }

        function createItemRow() {
            const rowId = `item-${itemCount}`;
            const rowDiv = document.createElement('div');
            rowDiv.className = 'item-row';
            rowDiv.id = rowId;
            rowDiv.innerHTML = `
                <div class="material-col">
                    <input type="text" class="material-input" placeholder="Buscar material..." autocomplete="off">
                    <div class="suggestions-box" id="sug-${rowId}"></div>
                    <input type="hidden" class="material-hidden" value="">
                </div>
                <div class="qty-col"><input type="number" class="qty-input" placeholder="Cant." min="0.01" step="0.01" value=""></div>
                <div class="unit-col"><input type="text" class="unit-input" placeholder="Unidad" readonly></div>
                <div class="action-col"><button type="button" class="btn-icon remove-item"><i class="fas fa-trash"></i></button></div>
            `;
            itemsContainer.appendChild(rowDiv);
            itemCount++;

            const materialInput = rowDiv.querySelector('.material-input');
            const hiddenInput = rowDiv.querySelector('.material-hidden');
            const suggestionsBox = rowDiv.querySelector('.suggestions-box');
            const unitInput = rowDiv.querySelector('.unit-input');

            materialInput.addEventListener('input', function(e) {
                const query = e.target.value;
                unitInput.value = '';
                if (query.trim().length < 2) { suggestionsBox.style.display = 'none'; hiddenInput.value = ''; return; }
                
                const resultados = buscarMateriales(query);
                if (resultados.length === 0) { suggestionsBox.style.display = 'none'; return; }
                
                suggestionsBox.innerHTML = resultados.map(m => `<div data-nombre="${m.nombre.replace(/"/g, '&quot;')}" data-unidad="${m.unidad}">${m.display}</div>`).join('');
                suggestionsBox.style.display = 'block';

                suggestionsBox.querySelectorAll('div').forEach(div => {
                    div.addEventListener('click', function() {
                        materialInput.value = this.dataset.nombre;
                        hiddenInput.value = this.dataset.nombre;
                        unitInput.value = this.dataset.unidad;
                        suggestionsBox.style.display = 'none';
                    });
                });
            });

            materialInput.addEventListener('blur', () => setTimeout(() => suggestionsBox.style.display = 'none', 200));

            rowDiv.querySelector('.remove-item').addEventListener('click', function() {
                if (itemsContainer.children.length <= MIN_ITEMS) { showToast('Debe haber al menos un material.', true); return; }
                rowDiv.remove(); updateRemoveButtons();
            });
        }

        function updateRemoveButtons() {
            const rows = itemsContainer.querySelectorAll('.item-row');
            rows.forEach(row => { const btn = row.querySelector('.remove-item'); if (btn) btn.disabled = (rows.length <= MIN_ITEMS); });
        }

        function validateAndCollect() {
            if (!fechaInput.value) { showToast('La fecha es obligatoria.', true); return null; }
            if (!usuarioSelect.value) { showToast('Seleccione un usuario.', true); return null; }
            if (!usoTextarea.value.trim()) { showToast('Describa el uso.', true); return null; }

            const rows = itemsContainer.querySelectorAll('.item-row');
            const items = [];
            let valid = true;

            rows.forEach(row => {
                const materialInput = row.querySelector('.material-input');
                const hiddenInput = row.querySelector('.material-hidden');
                const qtyInput = row.querySelector('.qty-input');
                const unitInput = row.querySelector('.unit-input');
                const materialName = hiddenInput.value || materialInput.value.trim();

                if (!materialName) { materialInput.classList.add('error-shake'); setTimeout(() => materialInput.classList.remove('error-shake'), 400); valid = false; }
                if (!qtyInput.value || parseFloat(qtyInput.value) <= 0) { qtyInput.classList.add('error-shake'); setTimeout(() => qtyInput.classList.remove('error-shake'), 400); valid = false; }
                if (!unitInput.value) { unitInput.classList.add('error-shake'); setTimeout(() => unitInput.classList.remove('error-shake'), 400); valid = false; }

                if (materialName && qtyInput.value && parseFloat(qtyInput.value) > 0) {
                    items.push({ material: materialName, cantidad: parseFloat(qtyInput.value), unidad: unitInput.value });
                }
            });

            if (!valid) { showToast('Complete todos los materiales.', true); return null; }
            if (items.length === 0) { showToast('Agregue al menos un material válido.', true); return null; }

            return { fecha: fechaInput.value, usuario: usuarioSelect.value, uso: usoTextarea.value.trim(), items };
        }

        async function downloadAndParseExcel() {
            const url = `https://raw.githubusercontent.com/${ghUser}/${ghRepo}/main/${ghPath}?t=${Date.now()}`;
            const res = await fetch(url);
            if (!res.ok) throw new Error("No se pudo leer el archivo. Asegúrese de que el repositorio sea público.");
            const arrayBuffer = await res.arrayBuffer();
            const workbook = XLSX.read(arrayBuffer, { type: 'array' });
            return { workbook };
        }

        function mostrarComprobante(datos, operacion) {
            const fechaHora = new Date().toLocaleString('es-AR');
            let tablaHTML = '';
            
            datos.items.forEach(i => {
                tablaHTML += `
                    <tr>
                        <td>${i.material}</td>
                        <td style="text-align: center;">${i.cantidad}</td>
                        <td>${i.unidad || 'u.'}</td>
                    </tr>
                `;
            });

            receiptContent.innerHTML = `
                <h3>ENERSA</h3>
                <p><span>Fecha:</span> <strong>${fechaHora}</strong></p>
                <p><span>Usuario:</span> <strong>${datos.usuario}</strong></p>
                <p><span>Operación:</span> <strong>${operacion.toUpperCase()}</strong></p>
                <p><span>Uso:</span> <strong>${datos.uso}</strong></p>
                <table class="receipt-table">
                    <thead>
                        <tr>
                            <th>Material</th>
                            <th style="text-align: center;">Cant.</th>
                            <th>Unidad</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tablaHTML}
                    </tbody>
                </table>
                <div class="receipt-footer">
                    <p>Firma del responsable: ____________________</p>
                    <p>Comprobante generado automáticamente</p>
                </div>
            `;
            
            receiptModal.style.display = 'flex';
        }

        window.imprimirComprobante = function() {
            const printArea = document.createElement('div');
            printArea.id = 'printArea';
            printArea.innerHTML = receiptContent.outerHTML;
            document.body.appendChild(printArea);
            window.print();
            setTimeout(() => { printArea.remove(); }, 1000);
        };

        async function procesarOperacion(operacion) {
            const datos = validateAndCollect();
            if (!datos) return;

            loader.style.display = 'block';
            retiroBtn.disabled = true;
            devolucionBtn.disabled = true;
            modeBadge.textContent = operacion === 'retiro' ? 'Procesando Retiro...' : 'Procesando Devolución...';
            modeBadge.style.color = operacion === 'retiro' ? 'var(--accent-color)' : 'var(--warning-color)';

            try {
                const payloadHTML = {
                    fecha: datos.fecha + ' ' + new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }),
                    usuario: datos.usuario,
                    operacion: operacion,
                    uso: datos.uso,
                    items: datos.items
                };

                const res = await fetch(urlGoogle, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(payloadHTML)
                });

                if (!res.ok) throw new Error("Error al conectar con Google.");

                showToast(`✅ ${operacion.toUpperCase()} procesado.`);
                
                mostrarComprobante(datos, operacion);

                usoTextarea.value = '';
                itemsContainer.innerHTML = '';
                createItemRow();
                itemCount = 1;
                updateRemoveButtons();

            } catch (error) {
                showToast(error.message, true);
            } finally {
                loader.style.display = 'none';
                retiroBtn.disabled = false;
                devolucionBtn.disabled = false;
                modeBadge.textContent = 'Esperando acción';
                modeBadge.style.color = 'var(--text-muted)';
            }
        }

        window.devolucionRapida = async function(usuario, material, cantidad, uso) {
            if(!confirm(`¿Está seguro que desea devolver ${cantidad} unidad/es de "${material}" al stock?`)) return;
            
            const hoy = new Date().toISOString().split('T')[0];
            const hora = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
            
            const payloadHTML = {
                fecha: hoy + ' ' + hora,
                usuario: usuario,
                operacion: 'devolucion',
                uso: `Devolución rápida de: ${uso}`,
                items: [{
                    material: material,
                    cantidad: parseFloat(cantidad),
                    unidad: ''
                }]
            };

            try {
                showToast("Procesando devolución rápida...");
                const res = await fetch(urlGoogle, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(payloadHTML)
                });
                if(!res.ok) throw new Error("Error al conectar con Google.");
                showToast("✅ Devolución registrada.");
            } catch(e) {
                showToast(e.message, true);
            }
        }

        async function mostrarStock() {
            stockModal.style.display = 'flex';
            stockTableBody.innerHTML = '<tr><td colspan="4" style="text-align:center;"><i class="fas fa-circle-notch fa-spin"></i> Cargando...</td></tr>';
            stockSearchInput.value = '';
            
            try {
                const { workbook } = await downloadAndParseExcel();
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                
                stockDataGlobal = [];
                for (let i = 2; i < json.length; i++) {
                    const row = json[i];
                    if (row && row[0]) {
                        stockDataGlobal.push({
                            nombre: row[0] || '',
                            especificacion: row[1] || '',
                            unidad: row[2] || '',
                            cantidad: row[3] !== undefined ? parseFloat(row[3]) : 0
                        });
                    }
                }
                renderStockTable(stockDataGlobal);
            } catch (error) {
                stockTableBody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--danger-color);">Error: ${error.message}</td></tr>`;
            }
        }

        function renderStockTable(data) {
            if (data.length === 0) {
                stockTableBody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No hay materiales.</td></tr>';
                return;
            }
            stockTableBody.innerHTML = data.map(item => {
                let qtyClass = item.cantidad <= 0 ? 'stock-cero' : (item.cantidad < 5 ? 'stock-bajo' : '');
                return `<tr><td>${item.nombre}</td><td>${item.especificacion}</td><td>${item.unidad}</td><td class="${qtyClass}">${item.cantidad}</td></tr>`;
            }).join('');
        }

        async function mostrarHistorial() {
            historyModal.style.display = 'flex';
            historyTableBody.innerHTML = '<tr><td colspan="7" style="text-align:center;"><i class="fas fa-circle-notch fa-spin"></i> Cargando...</td></tr>';
            
            try {
                const { workbook } = await downloadAndParseExcel();
                
                if (!workbook.SheetNames.includes('Historial')) {
                    historyTableBody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No hay historial registrado aún.</td></tr>';
                    filterUserSelect.innerHTML = '<option value="">Todos los usuarios</option>';
                    return;
                }

                const worksheet = workbook.Sheets['Historial'];
                const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                
                historyDataGlobal = [];
                for (let i = 1; i < json.length; i++) {
                    const row = json[i];
                    if (row && row[0]) {
                        historyDataGlobal.push({
                            fecha: row[0] || '',
                            usuario: row[1] || '',
                            operacion: row[2] || '',
                            material: row[3] || '',
                            cantidad: row[4] !== undefined ? parseFloat(row[4]) : 0,
                            uso: row[5] || ''
                        });
                    }
                }

                const usuariosUnicos = [...new Set(historyDataGlobal.map(item => item.usuario))].sort();
                filterUserSelect.innerHTML = '<option value="">Todos los usuarios</option>' + 
                    usuariosUnicos.map(u => `<option value="${u}">${u}</option>`).join('');

                renderHistoryTable(historyDataGlobal);
            } catch (error) {
                historyTableBody.innerHTML = `<tr><td colspan="7" style="text-align:center; color:var(--danger-color);">Error: ${error.message}</td></tr>`;
            }
        }

        function renderHistoryTable(data) {
            if (data.length === 0) {
                historyTableBody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No hay movimientos para este filtro.</td></tr>';
                return;
            }
            const reversedData = [...data].reverse();
            
            historyTableBody.innerHTML = reversedData.map(item => {
                let rowClass = item.operacion === 'RETIRO' ? 'row-retiro' : 'row-devolucion';
                let colorOp = item.operacion === 'RETIRO' ? 'var(--danger-color)' : 'var(--success-color)';
                
                let botonAccion = '';
                if (item.operacion === 'RETIRO') {
                    botonAccion = `<button class="btn-icon" style="background:transparent; color:var(--text-muted);" title="Devolver" onclick="devolucionRapida('${item.usuario.replace(/'/g, "\\'")}', '${item.material.replace(/'/g, "\\'")}', ${item.cantidad}, '${item.uso.replace(/'/g, "\\'")}')"><i class="fas fa-undo"></i></button>`;
                }

                return `
                    <tr class="${rowClass}">
                        <td>${item.fecha}</td>
                        <td>${item.usuario}</td>
                        <td style="color:${colorOp}">${item.operacion}</td>
                        <td>${item.material}</td>
                        <td>${item.cantidad}</td>
                        <td>${item.uso}</td>
                        <td>${botonAccion}</td>
                    </tr>
                `;
            }).join('');
        }

        window.imprimirTabla = function(tablaId) {
            const tabla = document.getElementById(tablaId);
            if (!tabla || tabla.rows.length <= 1) { alert("No hay datos para imprimir."); return; }
            const printArea = document.createElement('div');
            printArea.id = 'printArea';
            const tablaClon = tabla.cloneNode(true);
            
            if (tablaId === 'historyTable') {
                const rows = tablaClon.querySelectorAll('tr');
                rows.forEach(row => {
                    if(row.cells.length > 6) row.deleteCell(-1);
                });
            }

            printArea.appendChild(tablaClon);
            const titulo = document.createElement('h2');
            titulo.style.textAlign = 'center';
            titulo.style.marginBottom = '20px';
            titulo.style.fontFamily = 'sans-serif';
            titulo.innerText = tablaId === 'stockTable' ? 'Reporte de Stock - ENERSA' : 'Reporte de Movimientos - ENERSA';
            printArea.prepend(titulo);
            document.body.appendChild(printArea);
            window.print();
            setTimeout(() => { printArea.remove(); }, 1000);
        };

        window.exportarTablaExcel = function(tablaId, nombreArchivo) {
            const tabla = document.getElementById(tablaId);
            if (!tabla || tabla.rows.length <= 1) { alert("No hay datos para exportar."); return; }
            
            const tablaClon = tabla.cloneNode(true);
            
            if (tablaId === 'historyTable') {
                const rows = tablaClon.querySelectorAll('tr');
                rows.forEach(row => {
                    if(row.cells.length > 6) row.deleteCell(-1);
                });
            }

            const wb = XLSX.utils.table_to_book(tablaClon, {sheet: "Datos"});
            const fecha = new Date().toISOString().slice(0,10);
            XLSX.writeFile(wb, `${nombreArchivo}_${fecha}.xlsx`);
        };

        // INICIALIZACIÓN
        fechaInput.value = new Date().toISOString().split('T')[0];
        USUARIOS.forEach(u => { const opt = document.createElement('option'); opt.value = u; opt.textContent = u; usuarioSelect.appendChild(opt); });
        createItemRow(); 
        updateRemoveButtons();

        addItemBtn.addEventListener('click', () => {
            if (itemsContainer.children.length >= MAX_ITEMS) { showToast(`Máximo ${MAX_ITEMS} materiales.`, true); return; }
            createItemRow(); updateRemoveButtons();
        });

        retiroBtn.addEventListener('click', () => procesarOperacion('retiro'));
        devolucionBtn.addEventListener('click', () => procesarOperacion('devolucion'));
        verStockBtn.addEventListener('click', mostrarStock);
        verHistorialBtn.addEventListener('click', mostrarHistorial);
        
        closeStockBtn.addEventListener('click', () => { stockModal.style.display = 'none'; });
        closeHistoryBtn.addEventListener('click', () => { historyModal.style.display = 'none'; });

        stockSearchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (!query) { renderStockTable(stockDataGlobal); return; }
            const filtered = stockDataGlobal.filter(item => item.nombre.toLowerCase().includes(query) || item.especificacion.toLowerCase().includes(query));
            renderStockTable(filtered);
        });

        filterUserSelect.addEventListener('change', (e) => {
            const user = e.target.value;
            if (!user) { renderHistoryTable(historyDataGlobal); return; }
            const filtered = historyDataGlobal.filter(item => item.usuario === user);
            renderHistoryTable(filtered);
        });

        resetBtn.addEventListener('click', () => {
            if(confirm('¿Seguro que desea limpiar el formulario?')) {
                usoTextarea.value = '';
                usuarioSelect.value = '';
                itemsContainer.innerHTML = '';
                createItemRow();
                itemCount = 1;
                updateRemoveButtons();
                fechaInput.value = new Date().toISOString().split('T')[0];
            }
        });
    });
</script>
