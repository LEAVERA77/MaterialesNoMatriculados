<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENERSA · Gestión de Materiales</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: #f4f7fc; padding: 1.5rem; color: #1e2b3a; }
        .container { max-width: 1100px; margin: 0 auto; background: white; border-radius: 28px; box-shadow: 0 15px 35px rgba(0, 20, 30, 0.12); padding: 2rem; }
        h1 { font-size: 1.9rem; font-weight: 600; display: flex; align-items: center; gap: 0.75rem; border-bottom: 3px solid #e2e8f0; padding-bottom: 1rem; margin-bottom: 1.8rem; color: #0b2b4b; }
        h1 i { color: #1f7b8c; }
        
        /* Panel de Configuración */
        .config-panel { background: #fff3cd; border: 1px solid #ffe69c; padding: 1.5rem; border-radius: 16px; margin-bottom: 2rem; transition: opacity 0.3s; }
        .config-panel h3 { margin-bottom: 1rem; color: #664d03; display: flex; align-items: center; gap: 0.5rem; }
        .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
        .config-grid input { width: 100%; padding: 0.8rem 1rem; border: 1.5px solid #d6e0ea; border-radius: 16px; font-family: inherit; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem 2rem; margin-bottom: 1.5rem; }
        .field-group { display: flex; flex-direction: column; gap: 0.45rem; }
        .field-group label { font-weight: 600; font-size: 0.9rem; text-transform: uppercase; color: #2c4b66; }
        input, select, textarea { width: 100%; padding: 0.8rem 1rem; border: 1.5px solid #d6e0ea; border-radius: 16px; font-size: 0.95rem; font-family: inherit; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #1f7b8c; box-shadow: 0 0 0 4px rgba(31, 123, 140, 0.12); }
        .items-section { background: #f9fcff; border-radius: 22px; padding: 1.6rem; margin: 2rem 0; border: 1px solid #dde7f0; }
        .item-row { display: flex; gap: 0.8rem; align-items: flex-start; margin-bottom: 1rem; background: white; padding: 0.8rem; border-radius: 20px; border: 1px solid #e3ecf3; position: relative; }
        .material-col { flex: 3; position: relative; }
        .qty-col { flex: 1; min-width: 80px; }
        .unit-col { flex: 1; min-width: 90px; }
        .action-col { display: flex; align-items: center; justify-content: center; flex: 0 0 40px; }
        .btn-icon { background: #fff1f0; border: none; border-radius: 12px; width: 40px; height: 40px; color: #b33a3a; cursor: pointer; }
        .btn-icon:hover { background: #ffe0dd; }
        .suggestions-box { position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1.5px solid #cbdae6; border-radius: 16px; max-height: 220px; overflow-y: auto; z-index: 1000; display: none; margin-top: 4px; box-shadow: 0 12px 28px rgba(0,0,0,0.12); }
        .suggestions-box div { padding: 0.7rem 1rem; cursor: pointer; font-size: 0.9rem; border-bottom: 1px solid #edf2f7; }
        .suggestions-box div:hover { background: #e2f0f5; }
        .button-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; margin-top: 1.8rem; }
        .btn-group { display: flex; gap: 0.8rem; flex-wrap: wrap; }
        .btn { border: none; padding: 0.9rem 1.5rem; border-radius: 50px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 0.6rem; transition: 0.15s; }
        .btn-primary { background: #0b2b4b; color: white; }
        .btn-primary:hover { background: #123b63; }
        .btn-warning { background: #b4691f; color: white; }
        .btn-secondary { background: #e9f0f7; color: #1e3b57; }
        .btn-info { background: #17a2b8; color: white; }
        .btn-info:hover { background: #138496; }
        .btn-success { background: #1f7b5c; color: white; }
        .btn-success:hover { background: #16634a; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .toast { position: fixed; bottom: 30px; right: 30px; background: #1e3b4f; color: white; padding: 1rem 1.8rem; border-radius: 50px; font-weight: 500; opacity: 0; transition: 0.25s; z-index: 9999; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .toast.show { opacity: 1; }
        .toast.error { background: #b33a3a; }
        .required:after { content: " *"; color: #c42d2d; }
        .loader { display: none; text-align: center; padding: 1rem; font-weight: 600; color: #1f7b8c; font-size: 1.1rem; }
        .error-shake { animation: shake 0.2s ease-in-out; border-color: #c42d2d !important; }
        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } 100% { transform: translateX(0); } }
        input[readonly] { background-color: #f0f4f8; color: #5e7e99; cursor: not-allowed; }

        /* Modales */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 10000; padding: 1rem; }
        .modal-content { background: white; border-radius: 20px; width: 100%; max-width: 900px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .modal-header { padding: 1.5rem; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h2 { font-size: 1.4rem; color: #0b2b4b; margin: 0; }
        .modal-header button { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #888; }
        .modal-search { padding: 1rem 1.5rem; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; gap: 1rem; }
        .modal-search input, .modal-search select { width: 100%; padding: 0.8rem 1rem; border: 1.5px solid #cbdae6; border-radius: 12px; }
        .modal-body { padding: 1.5rem; overflow-y: auto; flex: 1; }
        .table-stock { width: 100%; border-collapse: collapse; text-align: left; }
        .table-stock th, .table-stock td { padding: 0.8rem; border-bottom: 1px solid #edf2f7; font-size: 0.9rem; }
        .table-stock th { background: #f4f7fc; color: #2c4b66; font-weight: 600; position: sticky; top: 0; }
        .table-stock tr:hover { background: #f9fcff; }
        .stock-cero { color: #c42d2d; font-weight: bold; }
        .stock-bajo { color: #b4691f; font-weight: bold; }
        .modal-footer { padding: 1rem 1.5rem; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; gap: 1rem; background: #f8fafc; border-radius: 0 0 20px 20px; }

        .hidden { display: none !important; }

        /* Estilos de Impresión A4 */
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea { position: absolute; left: 0; top: 0; width: 100%; padding: 0; margin: 0; }
            .table-stock { width: 100%; border: 1px solid #000; }
            .table-stock th, .table-stock td { border: 1px solid #000; padding: 0.5rem; font-size: 0.8rem; color: #000; }
            .table-stock th { background: #eee !important; -webkit-print-color-adjust: exact; }
            .modal-overlay { position: static; background: transparent; display: block; padding: 0; }
            .modal-content { box-shadow: none; max-height: none; max-width: none; border-radius: 0; }
            .modal-header, .modal-search, .modal-footer { display: none !important; }
            .modal-body { overflow: visible; padding: 0; }
            .stock-cero, .stock-bajo { color: #000 !important; font-weight: normal; }
            @page { size: A4; margin: 1.5cm; }
        }
    </style>
</head>
<body>
<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #e2e8f0; padding-bottom: 1rem; margin-bottom: 1.8rem;">
        <h1 style="border: none; margin: 0; padding: 0;"><i class="fas fa-clipboard-list"></i> Gestión de Materiales - ENERSA</h1>
        <button type="button" id="showConfigBtn" class="btn btn-secondary hidden" style="font-size: 0.8rem; padding: 0.4rem 1rem;" title="Cambiar Token o Repositorio"><i class="fas fa-cog"></i> Configuración</button>
    </div>

    <!-- Panel de Configuración -->
    <div class="config-panel hidden" id="configPanel">
        <h3><i class="fab fa-github"></i> Configuración de Conexión</h3>
        <div class="config-grid">
            <div class="field-group"><label>Usuario / Organización</label><input type="text" id="ghUser" value="LEAVERA77"></div>
            <div class="field-group"><label>Repositorio</label><input type="text" id="ghRepo" value="MaterialesNoMatriculados"></div>
            <div class="field-group"><label>Ruta del Archivo</label><input type="text" id="ghPath" value="listado_materiales_ENERSA.xlsx"></div>
            <div class="field-group"><label>Token de GitHub (Fine-grained)</label><input type="password" id="ghToken" placeholder="Pega aquí el token..."></div>
        </div>
        <button type="button" id="saveConfigBtn" class="btn btn-secondary" style="font-size: 0.9rem; padding: 0.6rem 1.5rem;"><i class="fas fa-save"></i> Guardar y Ocultar Panel</button>
    </div>

    <div class="form-grid">
        <div class="field-group">
            <label for="fecha">Fecha <span class="required"></span></label>
            <input type="date" id="fecha" required>
        </div>
        <div class="field-group">
            <label for="usuario">Usuario <span class="required"></span></label>
            <select id="usuario" required>
                <option value="">— Seleccionar —</option>
            </select>
        </div>
    </div>

    <div class="field-group" style="margin-bottom: 1.2rem;">
        <label for="uso">Uso / destino <span class="required"></span></label>
        <textarea id="uso" placeholder="Describa el uso que se le dará al material..." required></textarea>
    </div>

    <div class="items-section">
        <h2><i class="fas fa-tools"></i> Materiales a mover</h2>
        <div id="itemsContainer"></div>
        <button type="button" id="addItemBtn" class="btn btn-secondary" style="margin-top: 0.8rem; font-size: 0.9rem; padding: 0.6rem 1.2rem;"><i class="fas fa-plus-circle"></i> Añadir otro material</button>
    </div>

    <div class="button-bar">
        <div id="modeBadge" style="font-weight: 600; padding: 0.5rem 1.5rem; background: #d4e6f0; border-radius: 40px;">Modo: Esperando acción</div>
        <div class="btn-group">
            <button type="button" id="verStockBtn" class="btn btn-info"><i class="fas fa-boxes"></i> Ver Stock</button>
            <button type="button" id="verHistorialBtn" class="btn btn-success"><i class="fas fa-history"></i> Historial</button>
            <button type="button" id="retiroBtn" class="btn btn-primary"><i class="fas fa-arrow-down"></i> Grabar retiro</button>
            <button type="button" id="devolucionBtn" class="btn btn-warning"><i class="fas fa-arrow-up"></i> Grabar devolución</button>
            <button type="button" id="resetBtn" class="btn btn-secondary"><i class="fas fa-undo-alt"></i> Limpiar</button>
        </div>
    </div>
    <div id="loader" class="loader"><i class="fas fa-spinner fa-spin"></i> Conectando con GitHub...</div>
</div>

<!-- Modal Stock -->
<div class="modal-overlay" id="stockModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-boxes" style="color: #17a2b8;"></i> Stock en Tiempo Real</h2>
            <button type="button" id="closeStockBtn">&times;</button>
        </div>
        <div class="modal-search">
            <input type="text" id="stockSearchInput" placeholder="Buscar material por nombre o especificación...">
        </div>
        <div class="modal-body" id="printAreaStock">
            <table class="table-stock" id="stockTable">
                <thead>
                    <tr>
                        <th>Material</th>
                        <th>Especificación</th>
                        <th>Unidad</th>
                        <th>Stock</th>
                    </tr>
                </thead>
                <tbody id="stockTableBody"></tbody>
            </table>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-primary" onclick="imprimirTabla('stockTable')"><i class="fas fa-print"></i> Imprimir</button>
        </div>
    </div>
</div>

<!-- Modal Historial -->
<div class="modal-overlay" id="historyModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-history" style="color: #1f7b5c;"></i> Historial de Movimientos</h2>
            <button type="button" id="closeHistoryBtn">&times;</button>
        </div>
        <div class="modal-search">
            <select id="filterUserSelect">
                <option value="">Todos los usuarios</option>
                <!-- Se llena dinámicamente -->
            </select>
        </div>
        <div class="modal-body" id="printAreaHistory">
            <table class="table-stock" id="historyTable">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Usuario</th>
                        <th>Operación</th>
                        <th>Material</th>
                        <th>Cantidad</th>
                        <th>Uso</th>
                    </tr>
                </thead>
                <tbody id="historyTableBody"></tbody>
            </table>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-primary" onclick="imprimirTabla('historyTable')"><i class="fas fa-print"></i> Imprimir Tabla</button>
        </div>
    </div>
</div>

<div id="toast" class="toast">Mensaje</div>

        // 1. VARIABLES Y CONFIGURACIÓN

        const stockTableBody = document.getElementById('stockTableBody');
        
        const historyModal = document.getElementById('historyModal');
        const closeHistoryBtn = document.getElementById('closeHistoryBtn');
        const filterUserSelect = document.getElementById('filterUserSelect');
        const historyTableBody = document.getElementById('historyTableBody');

        function updateGlobalConfig() {
            ghUser = document.getElementById('ghUser').value.trim();
            ghRepo = document.getElementById('ghRepo').value.trim();
            ghPath = document.getElementById('ghPath').value.trim();
            ghToken = document.getElementById('ghToken').value.trim();
        }

        function loadConfig() {
            const saved = localStorage.getItem('energConfig');
            if (saved) {
                const config = JSON.parse(saved);
                document.getElementById('ghUser').value = config.user || 'LEAVERA77';
                document.getElementById('ghRepo').value = config.repo || 'MaterialesNoMatriculados';
                document.getElementById('ghPath').value = config.path || 'listado_materiales_ENERSA.xlsx';
                document.getElementById('ghToken').value = config.token || '';
                
                if (config.token && config.token.trim() !== '') {
                    updateGlobalConfig();
                    configPanel.classList.add('hidden');
                    showConfigBtn.classList.remove('hidden');
                }
            } else {
                configPanel.classList.remove('hidden');
            }
            updateGlobalConfig();
        }

        async function validarToken() {
            if (!ghToken) { showToast('Por favor, ingrese el Token de GitHub.', true); return false; }
            try {
                const url = `https://api.github.com/repos/${ghUser}/${ghRepo}/contents/${ghPath}`;
                const res = await fetch(url, { headers: { 'Authorization': `Bearer ${ghToken}`, 'Accept': 'application/vnd.github.v3+json' } });
                
                if (res.status === 401) { showToast('Token inválido o expirado.', true); return false; }
                if (res.status === 404) { showToast('Repositorio o archivo no encontrado.', true); return false; }
                if (!res.ok) { showToast(`Error de conexión: ${res.statusText}`, true); return false; }
                return true;
            } catch (error) {
                showToast('Error de red. Verifique su conexión o firewall.', true);
                return false;
            }
        }

        saveConfigBtn.addEventListener('click', async () => {
            updateGlobalConfig();
            const loaderDiv = document.createElement('div');
            loaderDiv.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Validando token...';
            loaderDiv.style.cssText = 'text-align:center; padding:1rem; font-weight:bold; color:#1f7b8c;';
            saveConfigBtn.parentNode.appendChild(loaderDiv);
            saveConfigBtn.disabled = true;

            const esValido = await validarToken();
            
            loaderDiv.remove();
            saveConfigBtn.disabled = false;

            if (esValido) {
                const config = { user: ghUser, repo: ghRepo, path: ghPath, token: ghToken };
                localStorage.setItem('energConfig', JSON.stringify(config));
                showToast('✅ Token validado y guardado.');
                configPanel.classList.add('hidden');
                showConfigBtn.classList.remove('hidden');
            }
        });

        showConfigBtn.addEventListener('click', () => {
            configPanel.classList.remove('hidden');
            showConfigBtn.classList.add('hidden');
        });

            "Tarugo para pared | Plastico de 8 mm  caja x 500 unidades | caja", "Tirafondo cabeza hexagonal | Tirafondo Hexagonal Zincado 5/16x8\" | pieza",
            "Tornillo autoperforante corto | T1 mecha 8x1/2\", cabeza philip | piezas", "Tornillo autoperforante largo | T1 mecha 8x3/4\", cabeza philip | piezas",
            "Tornillo FIX | Tirafondo tipo Fix 6x3/4 | pieza", "Tornillo tanque | 1/4 pulg x 3/4pulg | piezas",
            "Tornillo tirafondo | Cabeza Phillips, 6 mm x 1\" caja x 100 unidades | piezas", "Tornillo tirafondo | Cabeza Phillips, 8 mm x 1 1/2\" caja x 500 unidades | piezas",
            "Tornillo tirafondo | Cabeza Phillips, 8 mm x 1 3/4\" caja x 500 unidades | Caja"
        ];

        const MATERIALES = MATERIALES_RAW.map(line => {
            const parts = line.split('|').map(s => s.trim());
            return { 
                nombre: parts[0] || '—', 
                especificacion: parts[1] || '', 
                unidad: parts[2] || 'u.', 
                display: `${parts[0]} ${parts[1] ? '· ' + parts[1] : ''} (${parts[2]})`,
                searchString: `${parts[0]} ${parts[1]}`.toLowerCase()
            };
        });

        const USUARIOS = ["MATEO, LUCAS", "ESTEBENET, JONATHAN", "GRIMALDI, GABRIEL", "LEHNER, DANILO", "MONZÓN, HUGO", "GIMENEZ, ROSENDO", "CIARROCA, ENZO", "CIARROCA, MANUEL", "ISAAC, LEANDRO", "ELZESAR, JUAN", "MILANICH, ALEJANDRO", "CIARROCA, MANUEL", "GRILLE, EMILIANO", "NARVAEZ, RAUL", "MAIER, FERNANDO", "ALBARENQUE, FERNANDO", "LARA, VALENTIN", "ECKERT, ENZO", "WEISHEIM, FABIAN", "TABORDA, SERGIO", "GOMEZ, ALEJANDRO", "OLGIATTI, DUILIO", "VERA, LEANDRO"];

        let itemCount = 0;
        const MAX_ITEMS = 10;
        const MIN_ITEMS = 1;

        // ==========================================
        // 3. FUNCIONES AUXILIARES
        // ==========================================
        function showToast(msg, isError = false) {
            toastEl.textContent = msg;
            toastEl.className = `toast show ${isError ? 'error' : ''}`;
            clearTimeout(window.toastTimeout);
            window.toastTimeout = setTimeout(() => toastEl.classList.remove('show'), 4000);
        }

        function buscarMateriales(query) {
            if (!query || query.trim().length < 2) return [];
            const q = query.toLowerCase().trim();
            let resultados = MATERIALES.filter(m => m.searchString.includes(q));
            
            if (resultados.length === 0) {
                const scored = MATERIALES.map(m => {
                    const dist = levenshtein(q, m.searchString);
                    return { material: m, score: dist };
                });
                scored.sort((a, b) => a.score - b.score);
                resultados = scored.filter(s => s.score <= Math.max(3, Math.floor(q.length * 0.5))).map(s => s.material);
            }
            return resultados.slice(0, 10);
        }

        function levenshtein(a, b) {
            const matrix = [];
            for (let i = 0; i <= a.length; i++) matrix[i] = [i];
            for (let j = 0; j <= b.length; j++) matrix[0][j] = j;
            for (let i = 1; i <= a.length; i++) {
                for (let j = 1; j <= b.length; j++) {
                    matrix[i][j] = Math.min(matrix[i-1][j] + 1, matrix[i][j-1] + 1, matrix[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
                }
            }
            return matrix[a.length][b.length];
        }

        function createItemRow() {
            const rowId = `item-${itemCount}`;
            const rowDiv = document.createElement('div');
            rowDiv.className = 'item-row';
            rowDiv.id = rowId;
            rowDiv.innerHTML = `
                <div class="material-col">
                    <input type="text" class="material-input" placeholder="Buscar material..." autocomplete="off">
                    <div class="suggestions-box" id="sug-${rowId}"></div>
                    <input type="hidden" class="material-hidden" value="">
                </div>
                <div class="qty-col"><input type="number" class="qty-input" placeholder="Cant." min="0.01" step="0.01" value=""></div>
                <div class="unit-col"><input type="text" class="unit-input" placeholder="Unidad" readonly></div>
                <div class="action-col"><button type="button" class="btn-icon remove-item"><i class="fas fa-trash-alt"></i></button></div>
            `;
            itemsContainer.appendChild(rowDiv);
            itemCount++;

            const materialInput = rowDiv.querySelector('.material-input');
            const hiddenInput = rowDiv.querySelector('.material-hidden');
            const suggestionsBox = rowDiv.querySelector('.suggestions-box');
            const unitInput = rowDiv.querySelector('.unit-input');

            materialInput.addEventListener('input', function(e) {
                const query = e.target.value;
                unitInput.value = '';
                if (query.trim().length < 2) { suggestionsBox.style.display = 'none'; hiddenInput.value = ''; return; }
                
                const resultados = buscarMateriales(query);
                if (resultados.length === 0) { suggestionsBox.style.display = 'none'; return; }
                
                suggestionsBox.innerHTML = resultados.map(m => `<div data-nombre="${m.nombre.replace(/"/g, '&quot;')}" data-unidad="${m.unidad}">${m.display}</div>`).join('');
                suggestionsBox.style.display = 'block';

                suggestionsBox.querySelectorAll('div').forEach(div => {
                    div.addEventListener('click', function() {
                        materialInput.value = this.dataset.nombre;
                        hiddenInput.value = this.dataset.nombre;
                        unitInput.value = this.dataset.unidad;
                        suggestionsBox.style.display = 'none';
                    });
                });
            });

            materialInput.addEventListener('blur', () => setTimeout(() => suggestionsBox.style.display = 'none', 200));

            rowDiv.querySelector('.remove-item').addEventListener('click', function() {
                if (itemsContainer.children.length <= MIN_ITEMS) { showToast('Debe haber al menos un material.', true); return; }
                rowDiv.remove(); updateRemoveButtons();
            });
        }

        function updateRemoveButtons() {
            const rows = itemsContainer.querySelectorAll('.item-row');
            rows.forEach(row => { const btn = row.querySelector('.remove-item'); if (btn) btn.disabled = (rows.length <= MIN_ITEMS); });
        }

        function validateAndCollect() {
            if (!ghToken) { showToast('Configure el Token de GitHub primero.', true); configPanel.classList.remove('hidden'); return null; }
            if (!fechaInput.value) { showToast('La fecha es obligatoria.', true); return null; }
            if (!usuarioSelect.value) { showToast('Seleccione un usuario.', true); return null; }
            if (!usoTextarea.value.trim()) { showToast('Describa el uso.', true); return null; }

            const rows = itemsContainer.querySelectorAll('.item-row');
            const items = [];
            let valid = true;

            rows.forEach(row => {
                const materialInput = row.querySelector('.material-input');
                const hiddenInput = row.querySelector('.material-hidden');
                const qtyInput = row.querySelector('.qty-input');
                const unitInput = row.querySelector('.unit-input');
                const materialName = hiddenInput.value || materialInput.value.trim();

                if (!materialName) { materialInput.classList.add('error-shake'); setTimeout(() => materialInput.classList.remove('error-shake'), 400); valid = false; }
                if (!qtyInput.value || parseFloat(qtyInput.value) <= 0) { qtyInput.classList.add('error-shake'); setTimeout(() => qtyInput.classList.remove('error-shake'), 400); valid = false; }
                if (!unitInput.value) { unitInput.classList.add('error-shake'); setTimeout(() => unitInput.classList.remove('error-shake'), 400); valid = false; }

                if (materialName && qtyInput.value && parseFloat(qtyInput.value) > 0) {
                    items.push({ material: materialName, cantidad: parseFloat(qtyInput.value), unidad: unitInput.value });
                }
            });

            if (!valid) { showToast('Complete todos los materiales.', true); return null; }
            if (items.length === 0) { showToast('Agregue al menos un material válido.', true); return null; }

            return { fecha: fechaInput.value, usuario: usuarioSelect.value, uso: usoTextarea.value.trim(), items };
        }

        // ==========================================
        // 4. CONEXIÓN GITHUB (LEER/ESCRIBIR)
        // ==========================================
        async function downloadAndParseExcel() {
            const url = `https://api.github.com/repos/${ghUser}/${ghRepo}/contents/${ghPath}?t=${Date.now()}`;
            const res = await fetch(url, { headers: { 'Authorization': `Bearer ${ghToken}`, 'Accept': 'application/vnd.github.v3+json' } });
            if (!res.ok) {
                if(res.status === 401) throw new Error("Token inválido.");
                if(res.status === 404) throw new Error("No se encontró el archivo.");
                throw new Error(`Error al descargar: ${res.statusText}`);
            }
            const data = await res.json();
            
            const binary = atob(data.content);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            
            const workbook = XLSX.read(bytes, { type: 'array' });
            return { workbook, sha: data.sha };
        }

        async function updateExcelOnGitHub(workbook, sha, commitMsg) {
            const wbout = XLSX.write(workbook, { bookType: 'xlsx', type: 'array' });
            const bytes = new Uint8Array(wbout);
            let binary = '';
            for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
            const base64Content = btoa(binary);

            const url = `https://api.github.com/repos/${ghUser}/${ghRepo}/contents/${ghPath}`;
            const res = await fetch(url, {
                method: 'PUT',
                headers: { 'Authorization': `Bearer ${ghToken}`, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: commitMsg, content: base64Content, sha: sha })
            });
            if (!res.ok) {
                const err = await res.json();
                throw new Error(`Error al subir: ${err.message || res.statusText}`);
            }
            return await res.json();
        }

        // ==========================================
        // 5. LÓGICA DE OPERACIONES (RETIRO/DEVOLUCIÓN)
        // ==========================================
        async function procesarOperacion(operacion) {
            const datos = validateAndCollect();
            if (!datos) return;

            loader.style.display = 'block';
            retiroBtn.disabled = true;
            devolucionBtn.disabled = true;
            modeBadge.textContent = operacion === 'retiro' ? 'Procesando Retiro...' : 'Procesando Devolución...';
            modeBadge.style.background = operacion === 'retiro' ? '#cce5ff' : '#fdebd0';

            try {
                const { workbook, sha } = await downloadAndParseExcel();
                const sheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];
                const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                
                // 1. Modificar Stock en la Hoja Principal
                let modificados = 0;
                let noEncontrados = [];

                for (const item of datos.items) {
                    const nombreBuscado = item.material.toLowerCase().trim();
                    let rowIndex = -1;

                    for (let i = 2; i < json.length; i++) {
                        const row = json[i];
                        if (row && row[0] && row[0].toString().toLowerCase().trim() === nombreBuscado) {
                            rowIndex = i; break;
                        }
                    }

                    if (rowIndex !== -1) {
                        const celdaCantidad = XLSX.utils.encode_cell({ r: rowIndex, c: 3 });
                        let valorActual = 0;
                        if (worksheet[celdaCantidad] && worksheet[celdaCantidad].v !== undefined) {
                            valorActual = parseFloat(worksheet[celdaCantidad].v) || 0;
                        }
                        let nuevoValor = operacion === 'retiro' ? valorActual - item.cantidad : valorActual + item.cantidad;
                        nuevoValor = Math.max(0, Math.round(nuevoValor * 100) / 100);
                        worksheet[celdaCantidad] = { t: 'n', v: nuevoValor };
                        modificados++;
                    } else {
                        noEncontrados.push(item.material);
                    }
                }

                if (modificados === 0) throw new Error("Ningún material coincidió con la lista del Excel.");

                // 2. Registrar en la Hoja de Historial
                if (!workbook.SheetNames.includes('Historial')) {
                    const newWs = XLSX.utils.aoa_to_sheet([["Fecha", "Usuario", "Operacion", "Material", "Cantidad", "Uso"]]);
                    XLSX.utils.book_append_sheet(workbook, newWs, 'Historial');
                }
                const histSheetName = 'Historial';
                const histWorksheet = workbook.Sheets[histSheetName];
                
                const hoy = datos.fecha;
                const hora = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
                const timestamp = `${hoy} ${hora}`;

                datos.items.forEach(item => {
                    XLSX.utils.sheet_add_aoa(histWorksheet, [[
                        timestamp, datos.usuario, operacion.toUpperCase(), item.material, item.cantidad, datos.uso
                    ]], { origin: -1 }); // origin -1 agrega al final
                });

                // 3. Subir a GitHub
                const commitMsg = `${operacion.toUpperCase()} - ${datos.usuario} - ${datos.fecha}`;
                await updateExcelOnGitHub(workbook, sha, commitMsg);

                showToast(`Éxito: ${modificados} materiales actualizados.`);
                if(noEncontrados.length > 0) {
                    alert(`Atención: Los siguientes materiales no se encontraron:\n- ${noEncontrados.join('\n- ')}`);
                }
                
                usoTextarea.value = '';
                itemsContainer.innerHTML = '';
                createItemRow();
                itemCount = 1;
                updateRemoveButtons();

            } catch (error) {
                showToast(error.message, true);
            } finally {
                loader.style.display = 'none';
                retiroBtn.disabled = false;
                devolucionBtn.disabled = false;
                modeBadge.textContent = 'Modo: Esperando acción';
                modeBadge.style.background = '#d4e6f0';
            }
        }

        // ==========================================
        // 6. VER STOCK
        // ==========================================
        async function mostrarStock() {
            if (!ghToken) { showToast('Primero configure el Token.', true); configPanel.classList.remove('hidden'); return; }
            stockModal.style.display = 'flex';
            stockTableBody.innerHTML = '<tr><td colspan="4" style="text-align:center;"><i class="fas fa-spinner fa-spin"></i> Cargando...</td></tr>';
            stockSearchInput.value = '';
            
            try {
                const { workbook } = await downloadAndParseExcel();
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                
                stockDataGlobal = [];
                for (let i = 2; i < json.length; i++) {
                    const row = json[i];
                    if (row && row[0]) {
                        stockDataGlobal.push({
                            nombre: row[0] || '',
                            especificacion: row[1] || '',
                            unidad: row[2] || '',
                            cantidad: row[3] !== undefined ? parseFloat(row[3]) : 0
                        });
                    }
                }
                renderStockTable(stockDataGlobal);
            } catch (error) {
                stockTableBody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#c42d2d;">Error: ${error.message}</td></tr>`;
            }
        }

        function renderStockTable(data) {
            if (data.length === 0) {
                stockTableBody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No hay materiales.</td></tr>';
                return;
            }
            stockTableBody.innerHTML = data.map(item => {
                let qtyClass = item.cantidad <= 0 ? 'stock-cero' : (item.cantidad < 5 ? 'stock-bajo' : '');
                return `<tr><td>${item.nombre}</td><td>${item.especificacion}</td><td>${item.unidad}</td><td class="${qtyClass}">${item.cantidad}</td></tr>`;
            }).join('');
        }

        // ==========================================
        // 7. VER HISTORIAL
        // ==========================================
        async function mostrarHistorial() {
            if (!ghToken) { showToast('Primero configure el Token.', true); configPanel.classList.remove('hidden'); return; }
            historyModal.style.display = 'flex';
            historyTableBody.innerHTML = '<tr><td colspan="6" style="text-align:center;"><i class="fas fa-spinner fa-spin"></i> Cargando historial...</td></tr>';
            
            try {
                const { workbook } = await downloadAndParseExcel();
                
                if (!workbook.SheetNames.includes('Historial')) {
                    historyTableBody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No hay historial registrado aún.</td></tr>';
                    filterUserSelect.innerHTML = '<option value="">Todos los usuarios</option>';
                    return;
                }

                const worksheet = workbook.Sheets['Historial'];
                const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                
                historyDataGlobal = [];
                // Empezar en 1 porque la fila 0 son los encabezados
                for (let i = 1; i < json.length; i++) {
                    const row = json[i];
                    if (row && row[0]) {
                        historyDataGlobal.push({
                            fecha: row[0] || '',
                            usuario: row[1] || '',
                            operacion: row[2] || '',
                            material: row[3] || '',
                            cantidad: row[4] !== undefined ? parseFloat(row[4]) : 0,
                            uso: row[5] || ''
                        });
                    }
                }

                // Llenar el combo de filtros
                const usuariosUnicos = [...new Set(historyDataGlobal.map(item => item.usuario))].sort();
                filterUserSelect.innerHTML = '<option value="">Todos los usuarios</option>' + 
                    usuariosUnicos.map(u => `<option value="${u}">${u}</option>`).join('');

                renderHistoryTable(historyDataGlobal);
            } catch (error) {
                historyTableBody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#c42d2d;">Error: ${error.message}</td></tr>`;
            }
        }

        function renderHistoryTable(data) {
            if (data.length === 0) {
                historyTableBody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No hay movimientos para este filtro.</td></tr>';
                return;
            }
            // Invertir para mostrar lo más reciente primero
            const reversedData = [...data].reverse();
            
            historyTableBody.innerHTML = reversedData.map(item => `
                <tr>
                    <td>${item.fecha}</td>
                    <td>${item.usuario}</td>
                    <td style="font-weight:bold; color:${item.operacion === 'RETIRO' ? '#b33a3a' : '#1f7b5c'}">${item.operacion}</td>
                    <td>${item.material}</td>
                    <td>${item.cantidad}</td>
                    <td>${item.uso}</td>
                </tr>
            `).join('');
        }

        // ==========================================
        // 8. FUNCIÓN DE IMPRESIÓN
        // ==========================================
        window.imprimirTabla = function(tablaId) {
            const tabla = document.getElementById(tablaId);
            if (!tabla || tabla.rows.length <= 1) {
                alert("No hay datos para imprimir.");
                return;
            }
            
            // Creamos un área temporal solo con la tabla para imprimir
            const printArea = document.createElement('div');
            printArea.id = 'printArea';
            
            // Clonamos la tabla para no afectar la vista en pantalla
            const tablaClon = tabla.cloneNode(true);
            printArea.appendChild(tablaClon);
            
            // Título de impresión
            const titulo = document.createElement('h2');
            titulo.style.textAlign = 'center';
            titulo.style.marginBottom = '20px';
            titulo.style.fontFamily = 'sans-serif';
            titulo.innerText = tablaId === 'stockTable' ? 'Reporte de Stock - ENERSA' : 'Reporte de Movimientos - ENERSA';
            printArea.prepend(titulo);

            document.body.appendChild(printArea);
            
            // Ocultar todo excepto el area de impresión (el CSS @media print hace esto)
            window.print();
            
            // Limpiar después de imprimir
            setTimeout(() => {
                printArea.remove();
            }, 1000);
        };

        // ==========================================
        // 9. INICIALIZACIÓN Y EVENTOS
        // ==========================================
        loadConfig();
        fechaInput.value = new Date().toISOString().split('T')[0];
        
        USUARIOS.forEach(u => { 
            const opt = document.createElement('option'); opt.value = u; opt.textContent = u; usuarioSelect.appendChild(opt); 
        });

        createItemRow(); 
        updateRemoveButtons();

        addItemBtn.addEventListener('click', () => {
            if (itemsContainer.children.length >= MAX_ITEMS) { showToast(`Máximo ${MAX_ITEMS} materiales.`, true); return; }
            createItemRow(); updateRemoveButtons();
        });

        retiroBtn.addEventListener('click', () => procesarOperacion('retiro'));
        devolucionBtn.addEventListener('click', () => procesarOperacion('devolucion'));
        verStockBtn.addEventListener('click', mostrarStock);
        verHistorialBtn.addEventListener('click', mostrarHistorial);
        
        closeStockBtn.addEventListener('click', () => { stockModal.style.display = 'none'; });
        closeHistoryBtn.addEventListener('click', () => { historyModal.style.display = 'none'; });

        stockSearchInput.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (!query) { renderStockTable(stockDataGlobal); return; }
            const filtered = stockDataGlobal.filter(item => 
                item.nombre.toLowerCase().includes(query) || item.especificacion.toLowerCase().includes(query)
            );
            renderStockTable(filtered);
        });

        filterUserSelect.addEventListener('change', (e) => {
            const user = e.target.value;
            if (!user) { renderHistoryTable(historyDataGlobal); return; }
            const filtered = historyDataGlobal.filter(item => item.usuario === user);
            renderHistoryTable(filtered);
        });

        resetBtn.addEventListener('click', () => {
            if(confirm('¿Seguro que desea limpiar el formulario?')) {
                usoTextarea.value = '';
                usuarioSelect.value = '';
                itemsContainer.innerHTML = '';
                createItemRow();
                itemCount = 1;
                updateRemoveButtons();
                fechaInput.value = new Date().toISOString().split('T')[0];
            }
        });
    });
</script>
